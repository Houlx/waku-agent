<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Career Agent</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('career-theme')==='dark'?'dark':'light'}catch(e){}</script>
<link rel="stylesheet" href="/static/career/style.css">
</head><body>
<header><a class="identity" href="#overview">Career Agent</a>
<label class="locale-control"><span id="locale-label">UI language</span><select id="locale-select" onchange="CA.setLocale(this.value)"><option value="en">English</option><option value="zh-CN">简体中文</option></select></label>
<button id="theme-toggle" onclick="CA.toggleTheme()">Change theme</button></header>
<div class="career-shell"><aside class="career-sidebar"><details id="career-menu" open><summary>Navigation and Recent Jobs</summary><nav id="career-navigation" aria-label="Career navigation"></nav></details></aside>
<main><p id="provider-status" role="status"></p><div id="view"></div></main></div>
<dialog id="delete-dialog" aria-labelledby="delete-heading" aria-describedby="delete-description" oncancel="event.preventDefault();CA.cancelDelete()"></dialog>
<script src="/static/career/ui.js"></script>
<script src="/static/career/i18n.js"></script>
<script src="/static/career/state.js"></script>
<script src="/static/career/router.js"></script>
<script src="/static/career/actions.js"></script>
<script src="/static/career/render.js"></script>
<script src="/static/career/settings.js"></script>
<script src="/static/career/bootstrap.js"></script>
</body></html>
