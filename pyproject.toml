[project]
name = "waku-agent"
# Single source of truth is waku/__init__.py — pyproject and the package
# disagreed for four releases (0.1.4 here, 0.1.0 there) because nothing
# forced them to match. Now there is only one number to bump.
dynamic = ["version"]
description = "A minimal, transparent, local-first Waku: harness + loop + memory + eval, in code you can read in an afternoon."
readme = "README.md"
# Code is MIT; the Waku brand assets are not (LICENSE-BRAND); the bundled fonts
# are SIL OFL 1.1. PEP 639 lets the package say all three, so PyPI no longer
# reports the whole wheel as MIT.
license = "MIT AND OFL-1.1 AND LicenseRef-Waku-Brand"
license-files = ["LICENSE", "LICENSE-BRAND", "waku/ops/static/fonts/OFL-*.txt"]
authors = [{ name = "Sean Chen (ShenSeanChen)" }]
requires-python = ">=3.11"
keywords = ["ai-agent", "llm", "agent-framework", "local-first", "llmops", "memory", "eval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40",   # anthropic wire format: Anthropic, Kimi, GLM, MiniMax
    "openai>=1.50",      # openai wire format: OpenAI, Gemini, DeepSeek (and embeddings)
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/ShenSeanChen/waku-agent"
Repository = "https://github.com/ShenSeanChen/waku-agent"
Issues = "https://github.com/ShenSeanChen/waku-agent/issues"
Changelog = "https://github.com/ShenSeanChen/waku-agent/releases"

[project.scripts]
# Career Agent CLI: `waku` or `waku career`; `waku --help` lists commands.
waku = "waku.__main__:main"

[project.optional-dependencies]
# Offline Career and shared-runtime evaluation
eval = [
    "pytest>=8.0",
]
# LLM-Ops pillar: local trace dashboard (traces also always land in traces/*.jsonl)
tracing = [
    "arize-phoenix>=7.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]
dev = [
    "pytest>=8.0",
    # Pinned EXACTLY: an unpinned linter means every ruff release can turn CI
    # red with zero code changes (happened 2026-07-24 — 0.16.0 shipped new
    # rules and 106 violations appeared overnight). Bump deliberately.
    "ruff==0.16.0",
    # Already the [build-system] backend below, fetched into an isolated
    # build env on every `pip install` regardless. Declaring it here too
    # makes it importable in THIS venv, so
    # test_retired_consumers_never_ship can ask hatchling
    # which files a build would include without running one (offline, no
    # `uv` needed — task-B1-review.md, finding B1-F11).
    # Pinned EXACTLY, same reasoning as ruff above: that test calls
    # recurse_included_files, an internal, undocumented API, not part of
    # hatchling's stable surface. An unpinned floor lets a routine hatchling
    # release turn CI red with zero code change here. Re-verify the
    # enumeration still matches a real build before bumping this pin.
    "hatchling==1.32.4",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

# Source distributions contain the source and offline evals needed to build and test.
[tool.hatch.version]
path = "waku/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = [
    "docs", ".claude", ".deepeval", ".github",
    # Keep retired consumers out even if a local checkout restores them.
    "/skills/**", "/waku/skills/**", "/evals/judge/**", "/hosted/**", "/examples/**", "/lab/**", "/scripts/whiteboard/**",
]

[tool.hatch.build.targets.wheel]
packages = ["waku"]
exclude = ["/waku/skills/**"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Rules waku IGNORES on purpose — each is a deliberate style choice, not an
# oversight. If you're tempted to remove one, read the reason first:
ignore = [
    "BLE001",  # blind `except Exception` is the documented pattern: tools and
               # observers surface errors as text instead of crashing the loop
    "DTZ001", "DTZ005", "DTZ011",  # naive local datetimes are intentional —
               # daily trace files and workspace folders are named in the
               # user's local day, not UTC
    "S110",    # try/except/pass around optional integrations (OTel, extras)
    # RUF100 flags a `# noqa` for a rule that is no longer enabled. Because the
    # rules above are globally ignored, ANY `# noqa: BLE001` a contributor
    # writes — the natural, correct-looking thing to write next to a broad
    # `except Exception` — becomes a CI failure in a file they never touched.
    # That footgun blocked two community PRs (#14, #26) on 2026-07-26. Turning
    # RUF100 off costs us the ability to spot genuinely stale noqas; leaving it
    # on costs contributors a red CI they can't explain. Contributors win.
    "RUF100",
]
